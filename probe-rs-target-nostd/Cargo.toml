[package]
name = "probe-rs-target-nostd"
version.workspace = true
edition.workspace = true
description = "no_std compile-time target descriptions for probe-rs"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
defmt = { version = "1.0", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"

[features]
default = []
defmt = ["dep:defmt"]

# Each target-* feature includes the chip definitions and flash algorithm
# binaries for that family. Flash usage per family varies widely:
#
#   Family        | Algo binary | Chip variants
#   RP2040        |     364B    |  2
#   SAMD21        |     952B    | 34
#   STM32F4       |   22.3KB   | 149
#   nRF52         |    ~2KB    | 14
#   ESP32-C3      |   3.1KB    |  1
#   STM32H7       |  ~398KB    | 129  <-- see warning below
#
# Enable only the families you need to minimize Flash consumption.

target-aducm302x = []
target-air001 = []
target-air32f1 = []
